<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Order Placed - GroceryWala</title>

    <link rel="stylesheet"
          href="./style.css">

</head>

<body class="success-page">

    <div class="success-container">

        <div class="success-icon">
            ✓
        </div>

        <h1>Order Placed Successfully!</h1>

        <p class="success-message">
            Thank you for shopping with GroceryWala.
        </p>

        <p class="success-info">
            Your order has been saved successfully
            and the details have been shared with
            the shopkeeper on WhatsApp.
        </p>


        <div class="success-details">

            <div class="success-detail-row">

                <span>Payment Method</span>

                <strong>
                    Cash on Delivery
                </strong>

            </div>

            <div class="success-detail-row">

                <span>Order Status</span>

                <strong>
                    Order Placed
                </strong>

            </div>

        </div>


        <a href="./shop.html"
           class="success-btn">

            Continue Shopping

        </a>

    </div>


</body>

</html>
