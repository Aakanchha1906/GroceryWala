<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GroceryWala - Login</title>

    <link rel="stylesheet" href="./style.css">
</head>

<body class="login-page">

    <!-- HEADER -->

    <header class="login-header">

        <a href="shop.html" class="login-logo">
            🛒 GroceryWala
        </a>

        <a href="shop.html" class="back-shop">
            ← Back to Shop
        </a>

    </header>


    <!-- LOGIN CONTAINER -->

    <main class="login-container">

        <div class="login-card">

            <div class="login-icon">
                🛒
            </div>

            <h1>Welcome Back!</h1>

            <p class="login-subtitle">
                Login to continue shopping with GroceryWala
            </p>


            <!-- LOGIN FORM -->

            <form id="login-form">

                <div class="input-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <div class="input-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <div class="login-options">

                    <label class="remember-me">
                        <input type="checkbox">
                        Remember me
                    </label>

                    <a href="#">
                        Forgot Password?
                    </a>

                </div>


                <button type="submit" class="login-submit">
                    Login
                </button>

            </form>


            <div class="divider">
                <span>OR</span>
            </div>


            <p class="signup-text">
                Don't have an account?
                <a href="register.html">Create Account</a>
            </p>

        </div>

    </main>


    <!-- FOOTER -->

    <footer class="login-footer">

        <p>
            © 2026 GroceryWala. All Rights Reserved.
        </p>

    </footer>
    <script src="./Frontend/js/script.js"></script>
</body>

</html>
